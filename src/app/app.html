<header class="app-header">
  <mat-toolbar class="toolbar" role="navigation" aria-label="Główna nawigacja">
    <div class="toolbar__left">
      <img
        src="assets/logo/logo-icon.svg"
        alt="Logo trener osobisty"
        class="logo-icon"
      />
      <span class="logo-text">Training</span>
    </div>

    <nav class="toolbar__nav">
      @for (item of navItems; track item.fragment) {
        <button
          mat-button
          (click)="scrollTo(item.fragment)"
        >
          {{ item.label }}
        </button>
      }
      <button
        mat-stroked-button
        color="accent"
        routerLink="/admin"
        aria-label="Przejdź do panelu administratora"
      >
        Admin
      </button>
    </nav>
  </mat-toolbar>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
