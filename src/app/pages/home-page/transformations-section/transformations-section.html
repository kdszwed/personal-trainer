<section
        id="transformations"
        class="section section--transformations"
        [class.transformations--visible]="visible()"
>

    <div class="section__header">
        <h2>{{ transformationsSection().heading }}</h2>
        <p>{{ transformationsSection().subtitle }}</p>
    </div>

    <p class="section__description">
        {{ transformationsSection().description }}
    </p>

    <div class="transformations">
        @for (item of transformationsSection().transformations; track item.name) {

            <mat-card class="transformations__card">
                <div class="transformations__row">


                    <figure class="transformations__image-wrapper transformations__image-wrapper--before">
                        <img
                                [src]="item.beforeImageUrl"
                                [alt]="'Przed – ' + item.name"
                        />
                        <figcaption>Przed</figcaption>
                    </figure>


                    <div class="transformations__info">
                        <h3>{{ item.name }}</h3>
                        <p>{{ item.description }}</p>
                    </div>


                    <figure class="transformations__image-wrapper transformations__image-wrapper--after">
                        <img
                                [src]="item.afterImageUrl"
                                [alt]="'Po – ' + item.name"
                        />
                        <figcaption>Po</figcaption>
                    </figure>

                </div>
            </mat-card>

        }
    </div>
</section>
