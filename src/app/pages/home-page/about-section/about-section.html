<section id="about" class="section section--about">
  <div class="about">
    <div class="about__image-top">
      <img
        src="assets/images/trainer.webp"
        alt="Trener personalny"
      />
    </div>

    <div class="about__headline">
      <h1>{{ heroTitle() }}</h1>
      <p class="about__subtitle">
        {{ heroSubtitle() }}
      </p>
    </div>

    <div class="about__slogans">
      <div class="about__slogans-bg">
        <img
          src="assets/images/slogan.webp"
          alt="Slogans"
        />
      </div>

      <div class="about__slogans-cloud">
        @for (slogan of slogans(); track slogan) {
          <div class="about__slogan">
            <span class="about__slogan-inner">
              {{ slogan }}
            </span>
          </div>
        }
      </div>
    </div>

    <div class="about__description">
      <p class="about__intro">
        {{ aboutIntro() }}
      </p>

      @for (paragraph of aboutParagraphs(); track paragraph) {
        <p>{{ paragraph }}</p>
      }
    </div>

    <div class="about__power">
      <img
        src="assets/icons/power.svg"
        alt="Power"
      />
    </div>
  </div>
</section>
