<section id="achievements" class="section section--achievements">

  <div class="achievements__bg-parallax">
    <img
      src="assets/images/achievements2.webp"
      alt="Tło"
    />
  </div>

  <div class="achievements__content">

    <div class="section__header">
      <h2>{{ achievementsSection().heading }}</h2>
      <p>{{ achievementsSection().subtitle }}</p>
    </div>

    <p class="section__description">
      {{ achievementsSection().description }}
    </p>


    <div class="achievements__side-image">
      <img
        src="assets/images/achievements1.webp"
        alt="Osiągnięcia"
      />
    </div>

    <div class="achievements__grid">

      @for (item of achievementsSection().achievements; let i = $index; track item.label) {
        <mat-card class="achievements__card">

          <div class="achievements__value">
            {{ animatedValues()[i] }}<span class="achievements__suffix">{{ suffixes[i] }}</span>
          </div>


          <div class="achievements__label">
            {{ item.label }}
          </div>

        </mat-card>
      }

    </div>

  </div>
</section>
